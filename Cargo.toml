name = "gdma_mem2mem"
path = "examples/gdma_mem2mem.rs"
[[example]]
name = "watchdog_supervised"
path = "examples/watchdog_supervised.rs"
[[example]]
name = "wifi_scan"
path = "examples/wifi_scan.rs"
